version: 0.2

env:
  variables:
    TF_VAR_environment: "uat"
    TF_VAR_sqs_message_retention_period: "604800"  # 7 days
    TF_VAR_lambda_batch_size: "5"
    TF_VAR_use_localstack: "false"

phases:
  pre_build:
    commands:
      - echo "🚀 Starting STAGING deployment..."
      - echo "Environment: $ENVIRONMENT"
      - echo "AWS Region: $AWS_DEFAULT_REGION"
      
  build:
    commands:
      - echo "📦 Installing Terraform..."
      - wget https://releases.hashicorp.com/terraform/1.6.0/terraform_1.6.0_linux_amd64.zip
      - unzip terraform_1.6.0_linux_amd64.zip
      - chmod +x terraform
      - mv terraform /usr/local/bin/
      
      - echo "🔧 Initializing Terraform..."
      - cd terraform
      - terraform init
      
      - echo "✅ Validating configuration..."
      - terraform validate
      
      - echo "📋 Planning STAGING deployment..."
      - terraform plan -out=staging.tfplan
      
      - echo "🚀 Applying STAGING deployment..."
      - terraform apply -auto-approve staging.tfplan
      
  post_build:
    commands:
      - echo "✅ STAGING deployment completed successfully!"
      - echo "📊 Environment details:"
      - echo "   - Environment: UAT"
